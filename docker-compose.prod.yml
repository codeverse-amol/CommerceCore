services:

  web:
    build: .
    container_name: commercecore-web-prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.production
    volumes:
      - static_volume_prod:/app/staticfiles
      - ./media:/app/media
    depends_on:
      - redis

  redis:
    image: redis:8-alpine
    container_name: commercecore-redis-prod
    restart: unless-stopped

  celery:
    build: .
    container_name: commercecore-celery-prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.production
    command: celery -A core worker --loglevel=info
    depends_on:
      - redis

  nginx:
    image: nginx:alpine
    container_name: commercecore-nginx-prod
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume_prod:/app/staticfiles:ro
      - ./media:/app/media:ro
    depends_on:
      - web

volumes:
  static_volume_prod: