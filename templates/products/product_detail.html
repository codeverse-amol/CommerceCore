{% extends 'base.html' %}
{% load static %}
{% block content %}

{% block css %}
<link rel="stylesheet"
      href="{% static 'css/product_detail.css' %}">
{% endblock %}

<div class="product-detail-container">

    <div class="product-image-section">

        <img src="{{ product.image.url }}"
             class="product-detail-image">

    </div>

    <div class="product-info-section">

        <h1>{{ product.name }}</h1>

        <p class="category">
            {{ product.category.name }}
        </p>

        <h2 class="price">
            ₹{{ product.price }}
        </h2>

        <p class="description">
            {{ product.description }}
        </p>

        <p class="stock">
            Stock left: {{ product.stock }}
        </p>


        <a href="{% url 'add_to_cart' product.id %}"
           class="cart-btn">
            Add to Cart
        </a>

    </div>

</div>

{% endblock %}
