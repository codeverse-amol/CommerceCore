<!DOCTYPE html>
<html lang="en">
    <head>  
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Add Product</title>
    </head>
    <body>
        <h1>Add Product</h1>
        <a href="{% url 'add_category' %}">Add Category</a> |
        <a href="{% url 'add_tag' %}">Add Tag</a>
        <form method="post">
            {% csrf_token %}
            <table>
                {{ form.as_table }}
            </table>
            <button type="submit">Save</button>
        </form> 
        <br>
        <p><a href="{% url 'dashboard' %}">Return to Dashboard</a></p>
    </body>
</html>
