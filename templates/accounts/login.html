{% load static %}

    <link rel="stylesheet" type="text/css" href="{% static 'css/login.css' %}">
    <h1>Login to CommerceCore</h1>
    <form method='post'>
      {% csrf_token %}
      <table>
        {{ form.as_table }}
      </table>
      <button class="auth-btn login-btn" type="submit">Login</button>
    </form>
    <br>

    <p>Don't have an account?</p>
    <p><a href="{% url 'register_user' %}" class="auth-btn signup-btn">Sign Up</a></p>
