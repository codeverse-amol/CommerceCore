<!doctype html>
{% load static %}
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>Login to CommerceCore</title>
    <link rel="stylesheet" type="text/css" href="{% static 'css/login.css' %}">
  </head>
  <body>
    <h1>Login to CommerceCore</h1>
    <form method='post'>
      {% csrf_token %}
      <p>Username: <input type="text" name="username" placeholder="Enter Username"></p>
      <p>Password: <input type="password" name="password" placeholder="Enter Password"></p>

      <button class="btn" type="submit">Login</button>
    </form>
    <br>

    <p>Don't have an account?    <a href="{% url 'register_user' %}">Sign Up</a></p>
  </body>
</html>
