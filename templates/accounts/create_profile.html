{% extends 'base.html' %}
{% load static %}

{% block css %}
<link rel="stylesheet"
      href="{% static 'css/profile.css' %}">
{% endblock %}

{% block content %}

<div class="profile-container">

    <h1>Create Profile</h1>

    <form method="POST"
          enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit"
                class="edit-profile-btn">

            Save Profile

        </button>

    </form>

</div>

{% endblock %}
