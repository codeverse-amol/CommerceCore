{% extends 'base.html' %}

{% block title %}
Register
{% endblock %}

{% block content %}
    <h1>Register for CommerceCore</h1>
    <form method='post'>
        {% csrf_token %}
        <table>
            {{ form.as_table }}
        </table>
        <button class="auth-btn signup-btn" type="submit">Register</button>
    <br>

    <p><a href="{% url 'login' %}" class="auth-btn login-btn"> Back to Login</a></p>
{% endblock %}
